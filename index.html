<h1>PSY ARMY</h1>
<p class="sub">GUILD JOIN APPLICATION</p>

<form id="appForm">
<label>Full Name / Nickname *</label>
<input name="name" required placeholder="Enter your name">

<label>Free Fire UID *</label>
<input name="uid" required inputmode="numeric" placeholder="Enter your UID">

<label>In-game Name *</label>
<input name="ign" required placeholder="PSY XXXXX">

<label>Age *</label>
<input name="age" type="number" min="10" max="80" required placeholder="Your age">

<label>Region / Country *</label>
<input name="region" required placeholder="Tamil Nadu / India">

<label>Preferred Role *</label>
<select name="role" required>
<option value="">Select role</option>
<option>Rusher</option><option>Assaulter</option><option>Sniper</option>
<option>Support</option><option>IGL</option><option>Flexible</option>
</select>

<label>Previous Guild / Team</label>
<input name="team" placeholder="Optional">

<label>Why do you want to join PSY Army? *</label>
<textarea name="reason" required placeholder="Tell us about yourself..."></textarea>

<label>Discord Username</label>
<input name="discord" placeholder="username">

<button type="submit">SUBMIT APPLICATION ⚡</button>
<div class="success" id="success">Application form filled successfully!<br>Connect this form to your Discord/backend to receive applications.</div>
<div class="note">Your application should be reviewed by PSY Army staff before guild entry.</div>
</form>
</div>

<script>
document.getElementById('appForm').addEventListener('submit',function(e){
 e.preventDefault();
 document.getElementById('success').style.display='block';
 this.reset();
});
</script>
</body>
</html>
